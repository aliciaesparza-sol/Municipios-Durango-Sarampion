<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Municipios | Durango</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="map-overlay">
        <h1>Cobertura de Sarampión</h1>
        <p>Durango | 2026</p>
        
        <div class="controls">
            <label for="age-group">Grupo de Edad:</label>
            <select id="age-group">
                <option value="1_ano">1 Año (1ra Dosis)</option>
                <option value="18_meses">18 Meses (2da Dosis)</option>
                <option value="6_anos">6 Años (2da Dosis)</option>
            </select>
        </div>

        <div class="legend">
            <h4>Semaforización</h4>
            <div class="legend-item"><span class="color-box" style="background: #22c55e;"></span> Óptimo (≥95%)</div>
            <div class="legend-item"><span class="color-box" style="background: #eab308;"></span> En Riesgo (80-94%)</div>
            <div class="legend-item"><span class="color-box" style="background: #ef4444;"></span> Crítico (<80%)</div>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
