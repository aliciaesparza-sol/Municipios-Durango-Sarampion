<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobertura Pre-Brote 2025 | Durango</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="map-overlay">
        <h1>Cobertura Pre-Brote 2025</h1>
        <p>Estado al 17 de Abril, 2025</p>
        
        <div class="controls">
            <label for="age-group">Grupo de Edad:</label>
            <select id="age-group">
                <option value="1_ano">1 Año (1ra Dosis)</option>
                <option value="18_meses">18 Meses (2da Dosis)</option>
                <option value="6_anos">6 Años (2da Dosis)</option>
            </select>
        </div>

        <div class="legend">
            <h4>Semaforización</h4>
            <div class="legend-item"><span class="color-box" style="background: #22c55e;"></span> Óptimo (≥95%)</div>
            <div class="legend-item"><span class="color-box" style="background: #eab308;"></span> En Riesgo (80-94%)</div>
            <div class="legend-item"><span class="color-box" style="background: #ef4444;"></span> Crítico (<80%)</div>
        </div>

        <div style="margin-top: 20px; border-top: 1px solid var(--glass-border); padding-top: 15px;">
            <a href="index.html" style="color: #818cf8; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center;">
                ← Volver al Mapa 2026
            </a>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="municipios_geo.js"></script>
    <script src="coverage_2025.js"></script>
    <script src="script_2025.js"></script>
</body>
</html>
